name: vars demo
run-name: environment and inputs

on: 
    push:
        branches: 
            - main
    workflow_dispatch:
        inputs:
            version:
                type: choice
                options:
                    - v1
                    - v2
                    - v3
                default: v1
            myenv:
                type: environment
                default: Dev

jobs:
    myjob:
        runs-on: ubuntu-latest
        environment: ${{inputs.myenv}}
        steps:
            - name: step1
              run: |
                echo "hi"
                echo "${{inputs.version}}"
                echo "my variables is ${{vars.MY_DEV_USER}}"
                sleep 200

    otherjob:
        runs-on: ubuntu-latest
        needs: 
            - myjob
        steps:
            - name: step1
              run: |
                echo "hi"
                echo "${{inputs.version}}"
                sleep 150



